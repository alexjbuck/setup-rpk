# Keeps the floating major (vX) and minor (vX.Y) tags pointing at the latest
# full release, so users can pin to `@v1` or `@v1.0`.
name: Update Floating Tags

on:
  release:
    types: [published]

permissions: {}

jobs:
  floating-tags:
    name: Move vX and vX.Y tags
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: write

    steps:
      - name: Point vX and vX.Y at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a vX.Y.Z tag; leaving floating tags alone."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)

          for t in "$major" "$minor"; do
            if gh api "repos/$REPO/git/ref/tags/$t" --silent 2>/dev/null; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/$t" -f sha="$sha" -F force=true --silent
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$t" -f sha="$sha" --silent
            fi
            echo "$t -> $sha"
          done
