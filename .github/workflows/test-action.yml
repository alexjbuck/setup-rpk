name: Test rpk Installation Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-latest:
    name: Test Latest Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test rpk installation (latest)
        uses: ./
        with:
          version: latest
      - name: Verify rpk installation
        run: |
          rpk version
          which rpk

  test-specific-version:
    name: Test Specific Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test rpk installation (specific version)
        uses: ./
        with:
          version: 24.2.21
      - name: Verify rpk installation
        run: |
          rpk version
          which rpk
          # Verify the version matches what we requested
          rpk --version | grep -q "24.2.21"

  test-arm64:
    name: Test on ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Test rpk installation on ARM64
        uses: ./
        with:
          version: latest
      - name: Verify rpk installation
        run: |
          rpk version
          which rpk
